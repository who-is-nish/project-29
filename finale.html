<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday 🎉</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
</head>
<body class="night-bg finale-bg">
<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

  <div class="container finale-container">
    <h1 class="fade-in">Happy Birthday 🎉</h1>

    <p class="fade-in delay-1">
      Ummeed Hai pasand aaya hoga 💖
    </p>

    <p class="fade-in delay-2">
      May this year bring you happiness with money, peace with travell,
      and everything you truly deserve (obv mujhe khilana pilana) ✨
    </p>

    <p class="fade-in delay-3 signature">
      — Apki life ka ek chota sa support <br>(bht hogyi baate ab party de)
    </br>
  </p>
  </div>

  <!-- 🎆 Confetti -->
  <div class="confetti-container"></div>

  <script>
    /* 🔐 PAGE LOCK — BLOCK BEFORE MIDNIGHT */
    function isUnlocked() {
      const now = new Date();
      const midnight = new Date();
      midnight.setHours(0, 0, 0, 0);
      return now >= midnight;
    }

    // if (!isUnlocked()) {
    //   window.location.href = "index.html";
    // }

    /* 🎉 CONFETTI EFFECT */
    const confettiContainer = document.querySelector(".confetti-container");

    for (let i = 0; i < 60; i++) {
      const confetti = document.createElement("span");
      confetti.classList.add("confetti");
      confetti.style.left = Math.random() * 100 + "vw";
      confetti.style.animationDelay = Math.random() * 5 + "s";
      confetti.style.animationDuration = 3 + Math.random() * 3 + "s";
      confettiContainer.appendChild(confetti);
    }

const music = document.getElementById("bgMusic");

window.addEventListener("load", () => {
    const savedTime = localStorage.getItem("musicTime");
    const isPaused = localStorage.getItem("musicPaused") === "true";
    const allowed = localStorage.getItem("musicAllowed") === "true";

    if (savedTime) {
        music.currentTime = parseFloat(savedTime);
    }

    // Resume only if user had already started it
    if (allowed && !isPaused) {
        music.play().catch(() => {});
    }
});

// Keep saving time continuously
setInterval(() => {
    if (!music.paused) {
        localStorage.setItem("musicTime", music.currentTime);
    }
}, 500);

// Save on exit (extra safety)
window.addEventListener("beforeunload", () => {
    localStorage.setItem("musicTime", music.currentTime);
});

  </script>

</body>
</html>
